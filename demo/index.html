        :root {

            --color-border: #1f1f1f;

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { overflow-x: clip; width: 100%; }
        html { scrollbar-width: thin; scrollbar-color: #2a2a2a #0a0a0a; }

        body {

            min-height: 100vh;
            display: flex;

        nav {

            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);

        .logo {

            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 3rem; list-style: none; }

        .nav-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--color-text); }

        main {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 9rem 2rem 5rem;
            text-align: center;
        }

        .demo-eyebrow {
            display: inline-block;
            color: var(--color-accent);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 2.5rem;
        }

        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--color-border);
            background: #000;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .video-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-caption {
            margin: 1.5rem auto 0;
            max-width: 720px;
            color: var(--color-text-secondary);
            font-size: 1.05rem;
        }

        .demo-cta {
            margin-top: 3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 2.5rem;
            background: var(--color-accent);
            color: white;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .cta-button:hover::before { left: 100%; }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.4);
        }

        .cta-button svg { width: 20px; height: 20px; transition: transform 0.3s ease; }
        .cta-button:hover svg { transform: translateX(4px); }

        .cta-button.secondary {
            background: transparent;
            color: var(--color-text);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: none;
        }

        .cta-button.secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: none;
        }

        footer {

            padding: 2rem 3rem;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.85rem;

            .video-frame { border-radius: 10px; }
            .demo-cta { flex-direction: column; align-items: stretch; }
            .cta-button { justify-content: center; padding: 1rem 2rem; font-size: 0.9rem; }
